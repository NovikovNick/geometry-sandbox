name: code style

on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-deploy-docs:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    # copypasted from raylib git workflow
    - name: Install Raylib Dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends libglfw3 libglfw3-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxext-dev libxfixes-dev libwayland-dev libxkbcommon-dev

    # Current version of emscripten uses clang 24
    - name: Install Clang 24
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 24
        sudo apt-get install -y clang-24 libc++-24-dev libc++abi-24-dev

    - name: Clang-tidy check
      run: |
        cmake -B build \
          -DCMAKE_C_COMPILER=clang-24 \
          -DCMAKE_CXX_COMPILER=clang++-24 \
          -DGSAND_ENABLE_TESTS=OFF \
          -DGSAND_ENABLE_BENCHMARKS=OFF \
          -DGSAND_BUILD_DOCS=OFF \
          -DGSAND_BUILD_SAMPLES=OFF \
          -DGSAND_USE_CLANG_TIDY=ON
        cmake --build build --config Release
